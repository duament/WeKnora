# ==============================================================================
# WeKnora embed nginx proxy
#
# Sits in front of the existing WeKnora frontend container and strips
# X-Frame-Options to allow the management SPA to be loaded inside an iframe.
# Direct access (port 80 on the frontend container) is unaffected.
#
# Access pattern:
#   http://host:80    → frontend (X-Frame-Options: SAMEORIGIN, for admin use)
#   http://host:8080  → frontend-embed (no X-Frame-Options, for iframe embed)
# ==============================================================================

server {
    listen       80;
    server_name  localhost;

    # File upload size
    client_max_body_size 300m;

    # Timeouts
    proxy_send_timeout 10m;
    proxy_read_timeout 10m;
    send_timeout       10m;

    # SPA 页面请求：fallback 到本地 dist-mod 的 index.html（带 /weknora/ 子路径支持）
    # 不再回退到 @p → 原版前端，否则返回的 HTML 引用 /assets/xxx（缺少 /weknora/ 前缀）
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;

        # index.html 及 SPA fallback 不可缓存，否则前端升级后用户看不到新版本
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # API 请求代理到原版前端 → 后端（前端容器的 nginx 会 proxy_pass /api/ 到后端）
    location /api/ {
        proxy_pass http://frontend:80;

        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "";

        # SSE / streaming support (agent chat, real-time QA)
        proxy_http_version 1.1;
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # /files 代理到后端（渲染 markdown 中的本地图片）
    location = /files {
        proxy_pass http://frontend:80;

        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
